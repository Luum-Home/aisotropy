# Retired commit identifiers cited in the documentation
#
# WHAT THIS IS
# Hexadecimal identifiers that appear in the docs formatted like git commit
# hashes, and that no longer resolve to any commit reachable from HEAD.
#
# WHY THEY DO NOT RESOLVE
# The 2026-07-27 filter-repo run did not merely renumber these commits; they are
# absent from its history entirely. Two pieces of evidence, of different strength:
#
#   STRONG, covers all of them — NONE of these identifiers appears as a key in
#   the 2026-07-27 commit-map. A commit that survived a rewrite always does. So
#   none of them can be repointed the way the 2026-08-03 rewrite's 31 citations
#   were (ADR-0080, "Note on the repository history").
#
#   NAMES ONLY THREE — the July run's own residue:
#     .git/filter-repo/suboptimal-issues (2026-07-27)
#     "The following commits were filtered out, but referenced in another
#      commit message ... left as-is"  9634e4f  06945bf  5404913
#   filter-repo only reports hashes referenced from COMMIT MESSAGES; it never
#   scans docs, so the other identifiers could not appear here even if filtered
#   out the same way. Read as confirmation of the MECHANISM, not as a roster.
#
# Which leaves two possible fates per identifier, both unrecoverable and not
# worth distinguishing further: filtered out by the July run, or living on a
# worktree branch deleted before it (the entry for 9634e4f is literally cited in
# the docs as "Branch worktree-agent-… (deleted)"). They are unrecoverable from
# every artifact this project retains, including the pre-2026-08-03 backup
# bundle, which post-dates the July run.
#
# WHAT THEY STILL MEAN
# Nearly all of them label an ARENA BOARD RUN - "RESULTS.md @ 06945bf" names
# which measurement produced a number. That labelling function survives the
# hash becoming unresolvable, so the identifiers are RETAINED rather than
# deleted: removing them would destroy the provenance of measured claims to
# fix a link. They are declared here instead, which is the same rule the arena
# applies to its own matrix - declare, never silently omit.
#
# HOW THIS FILE IS USED
# scripts/check-doc-commit-citations.sh fails on any doc-cited hash that
# neither resolves nor appears below. New rot is caught; this debt is not
# re-reported.
#
# DO NOT add an entry to silence a citation you have just broken. If a hash
# stops resolving because of a NEW rewrite, repoint it from that rewrite's
# commit-map first; this file is only for hashes whose commits are gone.
#
# Generated 2026-08-03. Regenerate the occurrence counts with:
#   bash scripts/check-doc-commit-citations.sh --report

