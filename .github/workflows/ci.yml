name: CI

# Runs the full root-module quality gate on every push and pull request.
# ubuntu-latest ships with Docker available, so the Docker-gated integration
# tests (rqlite / Qdrant containers) run here too — no extra services block.
#
# NOTE ON MODULES: the arenas/*, examples/* and bench/* directories are SEPARATE
# Go modules (each has its own go.mod), so the root `go test ./...` does not
# descend into them. Only the root module (internal/..., aisotropy, cmd/...) is
# built, vetted, tested and coverage-gated here.
#
# They are gated — just NOT here. ADR-0043 (local-first CI gates) records the
# operator directive that new gates go to local git hooks rather than more paid
# Actions jobs, so the nested-module build/test lives in the pre-push hook
# (scripts/pre-push-gate.sh, via scripts/test-all.sh --quick), alongside
# govulncheck, the OWASP suite, the golden-set gate, the doc-citation check and
# the competitor-absence-claim guard. Do not re-add those as jobs here without
# amending ADR-0043 first — they were briefly added on 2026-08-04 and reverted
# the same day for exactly that reason.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      voice_real_lane:
        description: >-
          Run the ADR-0069 voice lane in its REAL mode (downloads STT/TTS models
          and builds the voicebox audio-backend image, several GB). Off by
          default: this is the opt-in half of the lane, exactly as it is on a
          developer machine.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · vet · test · coverage floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Single source of truth: the version pinned in go.mod.
          go-version-file: go.mod
          check-latest: false

      - name: gofmt (promoted packages)
        # The format gate is scoped to the same set the coverage floor covers:
        # internal/..., aisotropy/, cmd/aisotropy/. Thin demo/bench mains
        # (cmd/embed-bench, cmd/x, ...) carry pre-existing gofmt debt
        # and are excluded from both gates until formatted. Ratchet goal: extend
        # this to `gofmt -l .` once the excluded mains are clean.
        run: |
          unformatted="$(gofmt -l internal aisotropy cmd/aisotropy)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w internal aisotropy cmd/aisotropy"
            exit 1
          fi
          echo "gofmt: promoted packages are clean"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: License audit (root module + compose images)
        # Constitutional license gate (ADR-0067 companion): fails the build if a
        # root-module dependency resolves to a prohibited license (or has no
        # LICENSE file at all) or if any docker-compose image is not on the
        # reviewed allowlist. --root-only matches this workflow's scope note
        # above (nested demo modules are not gated here; the full sweep is
        # `scripts/license-audit.sh` run manually). Placed after `go build` so
        # GOMODCACHE is already populated with the root module's dependencies.
        run: bash scripts/license-audit.sh --root-only

      - name: go test (race + coverage)
        # -race forces covermode=atomic automatically. Docker is present on the
        # runner, so Docker-gated tests execute rather than skip.
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage floor
        # Weighted statement coverage over internal/... + aisotropy + cmd/aisotropy,
        # with internal/semantic/qdrant.go excluded (integration-gated behind the
        # `manual` build tag — needs a live Qdrant gRPC server; see the script
        # header). Floor is 92%, a small buffer under the promoted set's current
        # ~93%, and RATCHETS toward the ~95% honest ceiling (the remaining gap
        # is qdrant.go's live-service branches plus a few unreachable defensive
        # guards). Raise the second argument when the tree clears the next rung.
        run: .github/scripts/coverage-floor.sh coverage.out 92

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: ignore

  keybroker:
    name: keybroker build · vet · test (-tags keybroker)
    runs-on: ubuntu-latest
    # The key-brokering façade (App.RunTask/RunTasks), the `aisotropy task` CLI,
    # and the key-brokering arena are fenced behind the `keybroker` build tag so
    # the DEFAULT build/onramp is Docker-unaware (see docs/architecture/
    # positioning-key-brokering.md). The build-test job above proves the default
    # build is green WITHOUT that surface; this job proves the tagged surface still
    # compiles, vets, and tests — including the broker invariant against real
    # Docker on the runner — so the opt-in path cannot silently rot.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: gofmt (keybroker-tagged files)
        run: |
          unformatted="$(gofmt -l internal aisotropy cmd/aisotropy arenas/key-brokering)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: keybroker-tagged set is clean"

      - name: go vet (-tags keybroker)
        run: go vet -tags keybroker ./...

      - name: go build (-tags keybroker)
        run: go build -tags keybroker ./...

      - name: go test (-tags keybroker, race)
        # Docker is present on the runner, so the broker invariant
        # (TestRunTask_BrokerInvariant_KeyNeverEntersContainer) and the
        # key-brokering arena execute rather than skip.
        run: go test -tags keybroker ./... -race

  voice-lane:
    name: voice lane · offline WER units (ADR-0069)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pipecat 1.x declares Requires-Python >=3.11; numba (a base dep) does
          # not build on 3.14 — the same range venv-preflight.sh enforces.
          python-version: '3.11'

      # The cheap half of the lane, and the reason it can live on every push:
      # without VOICE_LANE=real the model-backed tests SKIP by their own
      # conftest, leaving the pure-stdlib WER unit tests. No models, no
      # containers, no provider, no network — pytest is the only install.
      - name: Install the test floor only
        run: pip install -r examples/voice-pipecat/requirements-test.txt

      - name: Offline lane (models absent by design)
        working-directory: examples/voice-pipecat
        run: pytest tests/ -q

      # A lane that always skips is a lane nobody notices has stopped working.
      # This asserts the split itself: some tests RAN and some SKIPPED. If a
      # future change makes everything skip, this job fails instead of going
      # quietly green.
      - name: Assert the lane split is real, not vacuous
        working-directory: examples/voice-pipecat
        run: |
          out="$(pytest tests/ -q 2>&1 | tail -1)"
          echo "$out"
          case "$out" in
            *passed*skipped*) echo "lane split intact: some ran, some skipped" ;;
            *) echo "::error::expected 'N passed, M skipped' — got: $out"; exit 1 ;;
          esac

  voice-lane-real:
    name: voice lane · REAL (manual dispatch only)
    # Opt-in by construction: never on push, never on PR. It downloads models
    # and builds a multi-GB image, which is exactly what the machine guard
    # exists to refuse locally — on a hosted runner the equivalent restraint is
    # requiring a human to ask for it.
    if: github.event_name == 'workflow_dispatch' && inputs.voice_real_lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # voicebox is built from the UNMODIFIED upstream clone. That is not a
      # convenience: building from source at a pinned tag is one of the
      # conditions that keeps the ADR-0077 GPL service exception valid, and
      # the published image is not publicly pullable anyway.
      - name: Clone voicebox at the pinned tag
        run: |
          git clone https://github.com/agjs/voicebox external/voicebox
          git -C external/voicebox checkout v0.2.12

      - name: Build + start the audio backend
        working-directory: examples/voice-pipecat
        run: |
          docker compose -f docker-compose.voicebox.yml up -d --build
          for _ in $(seq 1 60); do
            curl -fsS localhost:8790/health && break
            sleep 5
          done
          curl -fsS localhost:8790/health

      - name: Install the voice lane
        run: pip install -r examples/voice-pipecat/requirements.txt -r examples/voice-pipecat/requirements-test.txt

      - name: venv-independent preflight (packages are on the system python here)
        run: python -c "import pipecat, openai, httpx; import pipecat.services.openai.stt; print('voice lane imports OK')"

      - name: Start aisotropyd with JWT auth
        env:
          AISOTROPY_JWT_SECRET: ci-secret-change-me-32-bytes-min!!
        run: |
          go build -o /tmp/aisotropyd ./cmd/aisotropyd
          AISOTROPY_JWT_SECRET="$AISOTROPY_JWT_SECRET" /tmp/aisotropyd &
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 2; done

      - name: Real lane (WER round-trip, fixtures, file-based pipeline)
        working-directory: examples/voice-pipecat
        env:
          VOICE_LANE: real
          AISOTROPY_JWT_SECRET: ci-secret-change-me-32-bytes-min!!
        run: |
          export AISOTROPY_TENANT_JWT="$(python mint_jwt.py --tenant acme --user alice)"
          pytest tests/ -q

      - name: Tear the backend down
        if: always()
        working-directory: examples/voice-pipecat
        run: docker compose -f docker-compose.voicebox.yml down
