# CONTROL config — the DELIBERATELY BROKEN nginx, used only by the end-to-end
# proxy test to prove the incremental-delivery assertion has teeth.
#
# It reproduces a real, common operator footgun that buffers a token-by-token
# SSE stream into a single delayed dump:
#
#   1. proxy_ignore_headers          -> throw away aisotropyd's
#      X-Accel-Buffering                `X-Accel-Buffering: no` opt-out, so the
#                                        upstream header cannot rescue the stream.
#   2. proxy_buffering on            -> nginx reads the upstream into buffers
#                                        (its default).
#   3. gzip on (text/event-stream)   -> THE decisive knob. The gzip body filter
#                                        must accumulate the response to compress
#                                        it and — unlike bare proxy_buffering —
#                                        does NOT honor the upstream's per-token
#                                        flush, so the entire event stream is held
#                                        and delivered in one shot at EOF.
#
# WHY (1)+(2) ALONE ARE NOT ENOUGH (the honest finding): aisotropyd flushes every
# token, and its 15ms-per-token pacing makes the upstream socket would-block after
# each token. Modern nginx forwards its partial proxy buffer to the client on
# would-block, so with only `proxy_buffering on` the stream SURVIVES — a
# per-event-flushing upstream defeats plain proxy buffering. It takes a body
# filter that owns the whole response (gzip) to actually buffer it. This is not
# contrived: enabling gzip site-wide is a one-line change, and every browser sends
# `Accept-Encoding: gzip`, so this misconfiguration breaks SSE for real users.
#
# Do NOT copy this into production. It exists to fail on purpose.

worker_processes  1;
events {
    worker_connections 1024;
}

http {
    upstream aisotropyd {
        server aisotropyd:8080;
    }

    # Sabotage #3: gzip the event stream. gzip_min_length 0 + gzip_proxied any
    # ensure the tiny proxied SSE body is compressed (and therefore buffered).
    gzip            on;
    gzip_types      text/event-stream;
    gzip_proxied    any;
    gzip_min_length 0;

    server {
        listen 80;

        location / {
            proxy_pass http://aisotropyd;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # Sabotage #1 + #2:
            proxy_ignore_headers X-Accel-Buffering;   # discard aisotropyd's opt-out
            proxy_buffering on;                        # buffer the upstream response

            proxy_read_timeout 1h;
        }
    }
}
