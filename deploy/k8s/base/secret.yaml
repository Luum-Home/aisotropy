# Secret AISOTROPY_* values. EMPTY by default so the minimal path boots
# zero-config: with AISOTROPY_JWT_SECRET unset the binary runs in NoAuth mode
# (path tenant_id/user_id trusted, no credential check) — fine for a local
# throwaway cluster, NOT for anything reachable.
#
# To enable JWT auth, put an HS256 signing secret of AT LEAST 32 bytes under
# AISOTROPY_JWT_SECRET (the binary REFUSES TO BOOT on a shorter key). e.g.:
#
#   kubectl -n aisotropy create secret generic aisotropy-secrets \
#     --from-literal=AISOTROPY_JWT_SECRET="$(openssl rand -base64 48)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The Deployment references these keys with optional:true, so an absent key
# simply leaves the env var unset (NoAuth / keyless stub) rather than failing.
apiVersion: v1
kind: Secret
metadata:
  name: aisotropy-secrets
  labels:
    app.kubernetes.io/name: aisotropy
    app.kubernetes.io/component: runtime
type: Opaque
stringData: {}
  # AISOTROPY_JWT_SECRET: "replace-with-32+-byte-random-string-xxxxxxxx"   # HS256, >= 32 bytes
  # ANTHROPIC_API_KEY: "sk-ant-..."                                        # optional; unset -> keyless stub
  # AISOTROPY_OPS_TOKEN: "..."                                             # optional; gates /costs + /bitrate
