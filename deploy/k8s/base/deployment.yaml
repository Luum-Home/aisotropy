# aisotropyd — the single Distroless Go binary. In the base (minimal) form it
# runs with in-process memory tiers only: no external services required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisotropyd
  labels:
    app.kubernetes.io/name: aisotropy
    app.kubernetes.io/component: runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aisotropy
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aisotropy
        app.kubernetes.io/component: runtime
    spec:
      # The image is gcr.io/distroless/static-debian12:nonroot -> already runs as
      # UID/GID 65532. Pin it explicitly and harden the pod.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aisotropyd
          # Built locally from the repo Dockerfile and side-loaded into the
          # cluster (kind load / k3d image import), so IfNotPresent avoids a
          # registry pull for a tag that only exists on the node.
          image: aisotropy:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aisotropy-config
          env:
            # NoAuth unless the operator populates this key (>= 32 bytes, HS256).
            - name: AISOTROPY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aisotropy-secrets
                  key: AISOTROPY_JWT_SECRET
                  optional: true
            # Unset -> keyless stub LLM (canned responses); the runtime still boots.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aisotropy-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            # Unset -> /costs and /bitrate stay 503 (default-closed).
            - name: AISOTROPY_OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aisotropy-secrets
                  key: AISOTROPY_OPS_TOKEN
                  optional: true
          # Liveness: cheap in-process handler, always 200 while the process is up.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: probes the facts + semantic tiers (in-process here, real
          # network checks once the overlay wires rqlite/Qdrant). 503 -> degraded.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Writable scratch so readOnlyRootFilesystem can stay true.
            - name: tmp
              mountPath: /tmp
            # On-disk mode: mounted only when the PVC overlay/patch supplies it.
            # In the minimal base this path is unused (in-memory tiers).
      volumes:
        - name: tmp
          emptyDir: {}
