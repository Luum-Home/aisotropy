# Wire aisotropyd to the networked tiers. These env vars flip the runtime off its
# in-process fallbacks onto the real rqlite (facts) + Qdrant (semantic) services.
#
# Credentials (rqlite URL with embedded basic-auth, Qdrant API key) come from the
# aisotropy-tier-secrets Secret — NOT plaintext in the pod spec / ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisotropyd
spec:
  template:
    spec:
      containers:
        - name: aisotropyd
          env:
            # Facts tier -> rqlite HTTP API. The full URL (incl. user:pass) lives
            # in the Secret so the credential never lands in a ConfigMap or the
            # rendered pod env-literal.
            - name: RQLITE_URL
              valueFrom:
                secretKeyRef:
                  name: aisotropy-tier-secrets
                  key: RQLITE_URL
            # Semantic tier -> Qdrant gRPC. Host/port/collection are non-secret.
            - name: QDRANT_HOST
              value: "qdrant"
            - name: QDRANT_PORT
              value: "6334"
            - name: QDRANT_COLLECTION
              value: "aisotropy_knowledge"
            # Qdrant API key — presented on every request (internal/semantic).
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aisotropy-tier-secrets
                  key: QDRANT_API_KEY
            # QDRANT_USE_TLS: leave unset for in-cluster plaintext gRPC (the
            # NetworkPolicy already restricts who can reach Qdrant). Set to "true"
            # only when Qdrant is configured to serve TLS — see overlays/prod.
