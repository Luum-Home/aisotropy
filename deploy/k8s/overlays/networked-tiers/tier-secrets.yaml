# Tier credentials for the networked memory tiers.
#
# ==========================================================================
#  LOCAL-ONLY DEV PLACEHOLDERS — the values below are throwaway defaults for a
#  local cluster. NEVER reuse them for anything reachable, and NEVER copy prod
#  credentials in here. For a real deployment, provide this Secret out-of-band
#  (kubectl create secret / sealed-secrets / external-secrets) with strong,
#  unique values — see overlays/prod and docs/deployment/kubernetes.md.
# ==========================================================================
#
# Provisioned as a Secret (NOT a ConfigMap / env-literal) so the values are not
# exposed in the pod spec or the ConfigMap surface.
apiVersion: v1
kind: Secret
metadata:
  name: aisotropy-tier-secrets
  labels:
    app.kubernetes.io/name: aisotropy
    app.kubernetes.io/component: tiers
type: Opaque
stringData:
  # Qdrant API key. Consumed by BOTH sides with the SAME value:
  #   - the Qdrant service, via QDRANT__SERVICE__API_KEY (see qdrant.yaml)
  #   - aisotropyd's client, via QDRANT_API_KEY (see patch-aisotropyd-env.yaml,
  #     wired through internal/semantic/factory.go).
  QDRANT_API_KEY: "local-dev-qdrant-key-CHANGE-ME"

  # rqlite HTTP basic-auth credentials, embedded in the connection URL aisotropyd
  # reads (RQLITE_URL -> internal/facts OpenRqlite, which supports user:pass@host).
  # The password MUST match the "aisotropy" user in rqlite-users.json below.
  RQLITE_URL: "http://aisotropy:local-dev-rqlite-pw-CHANGE-ME@rqlite:4001"

  # rqlite auth/authz file (passed to rqlited via -auth, see rqlite.yaml).
  #   - "aisotropy": the app user, full permissions.
  #   - "*"        : the anonymous (unauthenticated) user, granted ONLY ready +
  #                  status so the kubelet readiness probe (GET /readyz, sent with
  #                  no credentials) still succeeds without exposing any data
  #                  endpoint (/db/query, /db/execute require auth).
  rqlite-users.json: |
    [
      { "username": "aisotropy", "password": "local-dev-rqlite-pw-CHANGE-ME", "perms": ["all"] },
      { "username": "*", "perms": ["ready", "status"] }
    ]
