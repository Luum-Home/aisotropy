# Reference nginx config to front aisotropyd (plain HTTP :8080 upstream).
#
# THE FOOTGUN: nginx buffers proxied responses by default (proxy_buffering on).
# For a token-by-token SSE stream that means nginx collects the whole event
# stream into its buffers and flushes it to the client in one write at the end —
# the live stream arrives as a single delayed dump, breaking the contract.
#
# TWO INDEPENDENT DEFENSES (belt and suspenders):
#   1. aisotropyd emits `X-Accel-Buffering: no` on every SSE route, which nginx
#      honors PER RESPONSE even under the default proxy_buffering on. So the
#      stream works through a DEFAULT nginx too — the operator does not have to
#      touch this file for streaming to function.
#   2. This config ALSO sets `proxy_buffering off` on the SSE location, so the
#      intent is explicit and independent of the upstream header.
#
# WHY AN HTTP/2 (:443) BLOCK FOR SSE: an SSE stream holds one HTTP connection
# open for its whole lifetime. Over HTTP/1.1 a browser opens ~6 connections per
# domain (RFC 7230 §6.4 guidance, universally implemented), so ~6 concurrent SSE
# streams to this origin SATURATE the pool and every further request — more
# streams, plus ordinary JSON/asset fetches to the same host — stalls until one
# frees up. HTTP/2 multiplexes many streams over ONE TCP connection, so the
# 6-per-domain cap disappears. HTTP/2 requires TLS in browsers, so the fix rides
# on the :443 server below (`listen 443 ssl; http2 on;`). The proxy<->upstream
# hop stays HTTP/1.1 (`proxy_http_version 1.1`) — HTTP/2 is a client<->proxy
# concern; the anti-buffering knobs are identical on both server blocks.
# (WebTransport / HTTP/3 could multiplex without the per-domain history at all,
# but is a FUTURE option, not adopted here — see docs/deployment/reverse-proxy.md.)
#
# TLS: aisotropyd serves plain HTTP and expects THIS proxy to terminate TLS (the
# production overlay sets AISOTROPY_REQUIRE_TLS=1 so aisotropyd refuses plaintext
# — front it here). The :80 block below is for an environment where TLS is
# terminated at an EDGE load balancer ahead of nginx (nginx then sees plain HTTP);
# the :443 block terminates TLS at nginx itself and is the one that unlocks
# HTTP/2. Supply the cert/key out-of-band (mounted files or a secret) at the
# placeholder paths below — never commit them.
#
# Run directly:  nginx -c /path/to/nginx.conf
# k8s ingress-nginx equivalent of the SSE location knobs:
#   nginx.ingress.kubernetes.io/proxy-buffering: "off"
#   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
# ingress-nginx serves HTTP/2 on its TLS listener by default, so the same
# multiplexing benefit applies to TLS-terminating ingress with no extra knob.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    upstream aisotropyd {
        server aisotropyd:8080;
    }

    # SSE connections are long-lived; do not let nginx cut them mid-stream.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Shared proxy headers + streaming knobs, defined once and included per
    # location so the :80 and :443 servers stay byte-for-byte identical in intent.

    # --- Plain HTTP (:80) ----------------------------------------------------
    # Use when TLS is terminated at an edge LB ahead of nginx (nginx sees HTTP),
    # or for local/dev. This listener is HTTP/1.1, so it is subject to the
    # ~6-connections-per-domain SSE cap described above — prefer the :443 block
    # for browser SSE at any real concurrency.
    server {
        listen 80;

        # SSE streaming routes (token-by-token): native aisotropy SSE, the Vercel
        # AI SDK adapter, and the AG-UI adapter. These must NOT be buffered.
        location ~ ^/v1/tenant/[^/]+/user/[^/]+/chat/(stream|aisdk|agui)$ {
            proxy_pass http://aisotropyd;
            proxy_http_version 1.1;      # keep-alive upstream for streaming
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;         # forward each upstream flush immediately
            proxy_cache off;             # never cache a stream
            chunked_transfer_encoding on;
            # nginx also honors aisotropyd's `X-Accel-Buffering: no` here — the two
            # defenses are redundant on purpose.
        }

        # Everything else: JSON chat (/chat, /chat/agent), /healthz, /health,
        # /costs, /openapi.json, /docs. Default buffering is fine for these.
        location / {
            proxy_pass http://aisotropyd;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- HTTP/2 over TLS (:443) — the SSE multiplexing path ------------------
    # This is the recommended front door for browser SSE: `http2 on` lets many
    # streams share ONE connection, removing the HTTP/1.1 ~6-per-domain cap. It
    # terminates TLS here; aisotropyd stays plain HTTP upstream. Point the two
    # ssl_* directives at your real cert/key (the paths below are PLACEHOLDERS —
    # supply them as mounted files or a secret; never commit them).
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;                                # <-- your hostname

        ssl_certificate     /etc/nginx/tls/tls.crt;   # <-- cert path (placeholder)
        ssl_certificate_key /etc/nginx/tls/tls.key;   # <-- key path  (placeholder)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Same two locations as the :80 server — SSE unbuffered, rest default. The
        # proxy<->upstream hop stays HTTP/1.1; HTTP/2 is only the client<->nginx leg.
        location ~ ^/v1/tenant/[^/]+/user/[^/]+/chat/(stream|aisdk|agui)$ {
            proxy_pass http://aisotropyd;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;   # -> "https"

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }
        location / {
            proxy_pass http://aisotropyd;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;   # -> "https"
        }
    }

    # Optional: once TLS is live, redirect plain HTTP to HTTPS (replace the :80
    # server above with a redirect, or add server_name-matched handling):
    # server { listen 80; server_name chat.example.com; return 308 https://$host$request_uri; }
}
