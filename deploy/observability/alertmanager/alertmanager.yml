# Alertmanager routing (prometheus/alertmanager, Apache-2.0).
#
# Default is a self-contained, no-egress config: alerts are grouped and sent to
# a `null` receiver so the stack runs offline out of the box. Wire a real
# receiver (PagerDuty / Slack / email) before this is anything but a demo — the
# commented blocks show the shape. Do NOT commit real routing keys or webhook
# URLs; inject them via a mounted secret or an env-rendered copy of this file.

global:
  resolve_timeout: 5m

route:
  receiver: "null"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: "null" # -> page (PagerDuty/Opsgenie) in a real deployment
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: "null" # -> chat (Slack/Teams) in a real deployment

receivers:
  - name: "null"

  # - name: pager
  #   pagerduty_configs:
  #     - routing_key_file: /etc/alertmanager/secrets/pagerduty_key
  #       severity: '{{ .CommonLabels.severity }}'
  #       description: '{{ .CommonAnnotations.summary }}'

  # - name: chat
  #   slack_configs:
  #     - api_url_file: /etc/alertmanager/secrets/slack_webhook
  #       channel: '#aisotropy-alerts'
  #       title: '{{ .CommonAnnotations.summary }}'
  #       text: '{{ .CommonAnnotations.description }}'

inhibit_rules:
  # A critical alert of the same alertname suppresses its warning twin.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname"]
