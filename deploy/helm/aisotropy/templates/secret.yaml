{{- if .Values.auth.jwtSecret }}
{{- if lt (len .Values.auth.jwtSecret) 32 }}
{{- fail "auth.jwtSecret must be at least 32 bytes (HS256 minimum) — aisotropyd refuses to boot on a shorter key. Leave it empty for NoAuth (local only)." }}
{{- end }}
{{- end }}
{{- if include "aisotropy.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aisotropy.secretName" . }}
  labels:
    {{- include "aisotropy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.jwtSecret }}
  {{ .Values.auth.jwtSecretKey }}: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.opsToken }}
  AISOTROPY_OPS_TOKEN: {{ .Values.opsToken | quote }}
  {{- end }}
{{- end }}
