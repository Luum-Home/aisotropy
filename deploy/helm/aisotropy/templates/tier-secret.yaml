{{- if and .Values.tiers.networked.enabled (not .Values.tiers.networked.auth.existingSecret) }}
{{- $a := .Values.tiers.networked.auth }}
{{- $rqliteHost := printf "%s-rqlite" (include "aisotropy.fullname" .) }}
{{- $rqlitePort := .Values.tiers.networked.rqlite.httpPort }}
# Networked-tier credentials. LOCAL-ONLY defaults unless you override auth.* (or
# point at auth.existingSecret). Provisioned as a Secret so no credential lands in
# a ConfigMap or the rendered pod env-literal.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aisotropy.tierSecretName" . }}
  labels:
    {{- include "aisotropy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tiers
type: Opaque
stringData:
  # Qdrant API key — same value on the Qdrant service (QDRANT__SERVICE__API_KEY)
  # and the aisotropyd client (QDRANT_API_KEY).
  QDRANT_API_KEY: {{ $a.qdrantApiKey | quote }}
  # rqlite connection URL with embedded basic-auth (aisotropyd reads RQLITE_URL).
  RQLITE_URL: {{ printf "http://%s:%s@%s:%v" $a.rqliteUser $a.rqlitePassword $rqliteHost $rqlitePort | quote }}
  # rqlite -auth users file. "aisotropy" = full perms; "*" anonymous = ready +
  # status only (so the unauthenticated /readyz probe works, data endpoints do not).
  rqlite-users.json: |
    [
      { "username": {{ $a.rqliteUser | quote }}, "password": {{ $a.rqlitePassword | quote }}, "perms": ["all"] },
      { "username": "*", "perms": ["ready", "status"] }
    ]
{{- end }}
