{{- include "aisotropy.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisotropy.fullname" . }}
  labels:
    {{- include "aisotropy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Omitted when autoscaling.enabled: the HPA owns the replica count, and a
  # templated `replicas` would reset it to replicaCount on every helm upgrade.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  # Recreate, not RollingUpdate: a rolling update starts the replacement pod
  # BEFORE terminating the old one (default maxSurge), and the replacement
  # cannot take the exclusive BadgerDB directory lock the running pod still
  # holds — the rollout stalls on a CrashLoop instead of completing. Recreate
  # trades a short downtime window for an upgrade that actually finishes.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "aisotropy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aisotropy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aisotropy.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: aisotropyd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aisotropy.fullname" . }}-config
          env:
            {{- $secretName := include "aisotropy.secretName" . }}
            {{- if or .Values.auth.jwtSecret .Values.auth.existingSecret }}
            - name: AISOTROPY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.auth.jwtSecretKey }}
                  optional: true
            {{- end }}
            {{- if or .Values.anthropicApiKey .Values.auth.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            {{- end }}
            {{- if or .Values.opsToken .Values.auth.existingSecret }}
            - name: AISOTROPY_OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: AISOTROPY_OPS_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.tiers.networked.enabled }}
            {{- $tierSecret := include "aisotropy.tierSecretName" . }}
            # Tier credentials from the Secret (never plaintext in ConfigMap/env).
            - name: RQLITE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $tierSecret }}
                  key: RQLITE_URL
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $tierSecret }}
                  key: QDRANT_API_KEY
            {{- if .Values.tiers.networked.qdrant.useTLS }}
            - name: QDRANT_USE_TLS
              value: "true"
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "aisotropy.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
