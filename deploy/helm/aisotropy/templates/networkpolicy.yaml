{{- if and .Values.tiers.networked.enabled .Values.networkPolicy.enabled }}
{{- $r := .Values.tiers.networked.rqlite }}
{{- $q := .Values.tiers.networked.qdrant }}
# Default-deny ingress to the tier pods, allowing ONLY aisotropyd. Selecting a pod
# with any Ingress policy default-denies all other ingress to it, so these two
# allow-lists ARE the default-deny for the tiers. Requires a policy-capable CNI to
# enforce (Calico/Cilium/Antrea); kindnet/flannel render but do not enforce.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aisotropy.fullname" . }}-rqlite-allow-aisotropyd
  labels:
    {{- include "aisotropy.labels" . | nindent 4 }}
    app.kubernetes.io/component: facts
spec:
  podSelector:
    matchLabels:
      {{- include "aisotropy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: facts
  policyTypes:
    - Ingress
  ingress:
    # aisotropyd -> rqlite HTTP API. The only client of the facts tier.
    - from:
        - podSelector:
            matchLabels:
              {{- include "aisotropy.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: runtime
      ports:
        - protocol: TCP
          port: {{ $r.httpPort }}
    # Raft peer traffic between rqlite pods (multi-node quorum only).
    - from:
        - podSelector:
            matchLabels:
              {{- include "aisotropy.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: facts
      ports:
        - protocol: TCP
          port: {{ $r.raftPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aisotropy.fullname" . }}-qdrant-allow-aisotropyd
  labels:
    {{- include "aisotropy.labels" . | nindent 4 }}
    app.kubernetes.io/component: semantic
spec:
  podSelector:
    matchLabels:
      {{- include "aisotropy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: semantic
  policyTypes:
    - Ingress
  ingress:
    # aisotropyd -> Qdrant gRPC (6334) + REST (6333). No other pod may reach it.
    - from:
        - podSelector:
            matchLabels:
              {{- include "aisotropy.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: runtime
      ports:
        - protocol: TCP
          port: {{ $q.grpcPort }}
        - protocol: TCP
          port: {{ $q.restPort }}
{{- end }}
