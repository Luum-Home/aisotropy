# Default values for aisotropy — MINIMAL BY DEFAULT.
#
# Out of the box this renders ONE Distroless binary with in-process memory tiers
# (BadgerDB working memory + in-process SQLite/FTS5 facts + in-process cosine
# semantic). No rqlite, no Qdrant, no persistence, no ingress. Flip the toggles
# below to grow into the networked-tier deployment.

# Number of aisotropyd pods. Read the "Horizontal scaling: what each posture
# costs" note under `autoscaling` BEFORE raising this — working memory lives
# inside each process, and with persistence.enabled a second replica cannot
# start at all (the chart refuses to render that combination).
replicaCount: 1

image:
  # Built locally from the repo Dockerfile and side-loaded (kind load / k3d image
  # import). Override to a registry ref for a real deployment.
  repository: aisotropy
  tag: local
  # IfNotPresent so a locally-loaded tag is not re-pulled from a registry.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Container listen address -> AISOTROPY_ADDR. The Service and probes follow this
# port automatically.
containerPort: 8080

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""

# ---------------------------------------------------------------------------
# Authentication (ADR-0024). Empty jwtSecret -> the binary boots in NoAuth mode
# (path tenant_id/user_id trusted, no credential check). Fine for a local
# throwaway cluster; set a >= 32-byte HS256 secret for anything reachable.
# The binary REFUSES TO BOOT on a shorter secret.
# ---------------------------------------------------------------------------
auth:
  # Provide the secret value here (chart creates the Secret)...
  jwtSecret: ""
  # ...or point at a pre-existing Secret you manage out-of-band.
  existingSecret: ""
  jwtSecretKey: AISOTROPY_JWT_SECRET

# Optional LLM provider key. Empty -> keyless stub (canned responses); the
# runtime still boots and every memory tier is exercisable.
anthropicApiKey: ""

# Optional bearer token gating the /costs and /bitrate ops endpoints. Empty ->
# those endpoints stay 503 (default-closed).
opsToken: ""

# ---------------------------------------------------------------------------
# Transport + NoAuth posture (coordinate with auth above).
#   requireTLS -> AISOTROPY_REQUIRE_TLS: aisotropyd refuses plaintext when true.
#     Keep false locally; set true in production (front with a TLS-terminating
#     ingress/proxy — see deploy/proxy, docs/deployment/reverse-proxy.md).
#   allowNoAuth -> AISOTROPY_ALLOW_NOAUTH: explicit opt-in to the keyless NoAuth
#     path (trusts path tenant_id/user_id with no credential check). true keeps
#     the local zero-config path booting; MUST be false in production so a JWT
#     secret is required. See values-prod.yaml for the hardened combination.
# ---------------------------------------------------------------------------
requireTLS: false
allowNoAuth: true

# ---------------------------------------------------------------------------
# NetworkPolicy fronting the networked tiers: default-deny ingress to rqlite +
# Qdrant, allow ONLY the aisotropyd pod. Only rendered when tiers.networked is
# enabled (no tier pods otherwise). Requires a policy-capable CNI to ENFORCE
# (Calico/Cilium/Antrea); kindnet/flannel render it but do not enforce.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true

# Extra plain (non-secret) env vars, injected verbatim.
extraEnv: []
#  - name: AISOTROPY_RATE_PER_SEC
#    value: "50"

# ---------------------------------------------------------------------------
# Networked memory tiers — OFF by default (this is the whole "minimal" point).
# When enabled, the chart deploys rqlite (facts) + Qdrant (semantic) as
# StatefulSets and wires aisotropyd via RQLITE_URL / QDRANT_HOST, mirroring
# docker-compose.yml.
# ---------------------------------------------------------------------------
tiers:
  networked:
    enabled: false
    # -----------------------------------------------------------------------
    # Tier credentials (rqlite HTTP auth + Qdrant API key). Provisioned as a
    # Secret, NOT a ConfigMap. The defaults below are LOCAL-ONLY placeholders —
    # override them (or point at an existingSecret) for anything reachable. The
    # same QDRANT_API_KEY value is presented by both the Qdrant service and the
    # aisotropyd client; the rqlite user:password is embedded in RQLITE_URL and
    # matched in the -auth users file.
    # -----------------------------------------------------------------------
    auth:
      qdrantApiKey: "local-dev-qdrant-key-CHANGE-ME"
      rqliteUser: "aisotropy"
      rqlitePassword: "local-dev-rqlite-pw-CHANGE-ME"
      # Provide your own Secret instead (keys: QDRANT_API_KEY, RQLITE_URL,
      # rqlite-users.json). When set, the chart does not render its own.
      existingSecret: ""
    # Pod- and container-level hardening applied to BOTH tier StatefulSets.
    # rqlite/qdrant run fine non-root (they only write to their mounted data
    # dirs); fsGroup makes the PVC group-writable for the non-root UID.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    rqlite:
      image: rqlite/rqlite:8.36.3
      httpPort: 4001
      raftPort: 4002
      storage: 1Gi
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
    qdrant:
      image: qdrant/qdrant:v1.12.4
      restPort: 6333
      grpcPort: 6334
      collection: aisotropy_knowledge
      # Present QDRANT_USE_TLS=true to the aisotropyd client. Only set true when
      # Qdrant actually serves TLS; in-cluster plaintext gRPC is fine behind the
      # NetworkPolicy for most deployments.
      useTLS: false
      storage: 2Gi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi

# ---------------------------------------------------------------------------
# On-disk mode for aisotropyd's OWN working memory (AISOTROPY_DATA_DIR). OFF by
# default -> fully in-memory pod.
#
# SINGLE REPLICA ONLY. The embedded BadgerDB takes an exclusive directory lock
# (badger.Open in internal/memory/working_memory.go) and every pod mounts the
# SAME ReadWriteOnce PVC, so a second pod either cannot attach the volume or
# crash-loops on the lock. The chart hard-fails `persistence.enabled` together
# with replicaCount > 1 (or autoscaling.maxReplicas > 1) instead of rendering a
# manifest that cannot boot. For the same reason the Deployment switches to the
# `Recreate` update strategy when persistence is on: a rolling update would
# start the replacement pod before releasing the lock and stall the rollout.
# ---------------------------------------------------------------------------
persistence:
  enabled: false
  mountPath: /data
  size: 1Gi
  accessMode: ReadWriteOnce
  # storageClassName: "" -> cluster default (kind standard, k3s local-path).
  storageClassName: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aisotropy.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---------------------------------------------------------------------------
# Session affinity at the ingress — OFF by default (enabling it changes how an
# existing ingress load-balances, so it is opt-in and never a silent upgrade).
#
# WHY IT WORKS WITHOUT TOUCHING CODE: tenant_id and user_id are PATH params on
# every conversational route — /v1/tenant/{tenant_id}/user/{user_id}/chat,
# .../chat/stream, .../chat/agent, .../ask (internal/api/chat.go:112-113 and
# siblings, pattern ^[a-zA-Z0-9_-]{1,64}$). An ingress that hashes the request
# URI therefore pins a user to a replica with no code change and no break in
# the OpenAPI contract. session_id, by contrast, travels in the BODY
# (internal/api/chat.go:68), so per-session affinity is not reachable this way.
#
# WHAT IT BUYS: with persistence OFF and N replicas, a user keeps landing on
# the pod that holds their working memory instead of answering from a cold
# context.
#
# WHAT IT DOES NOT BUY — read this before relying on it:
#   - Granularity is per (URI, user), NOT per user. ingress-nginx documents
#     upstream-hash-by as taking "the nginx variable, text value or any
#     combination thereof", with $request_uri as the example; nginx regex
#     captures ($1/$2) are NOT documented for this annotation, so the
#     tenant/user segment cannot be isolated from the annotation alone. A
#     client that mixes routes inside one conversation (POST .../chat and then
#     .../chat/stream) hashes to two different replicas. No v1 route takes a
#     query string, so $request_uri is at least stable per route here.
#   - /v1/chat/completions (OpenAI-compat, ADR-0066) carries NO tenant/user in
#     the path — identity comes from the bearer token. Every request to that
#     route hashes to the SAME replica. Do not enable affinity and expect it
#     to spread.
#   - A pod that dies takes its users' working memory with it. Affinity turns
#     that into a cold start on the replacement, not a wrong answer — it is
#     not high availability.
#   - Quota buckets and the /costs meter stay per-process regardless (see
#     `autoscaling` below and docs/deployment/runbook.md §1).
#   - It does nothing for persistence.enabled: that combination fails to boot,
#     it does not mis-route.
#
# Annotation names and accepted values verified against the ingress-nginx
# annotation reference:
#   https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
#
# Rendered only onto THIS chart's Ingress (ingress.enabled). If aisotropyd is
# fronted by an ingress you manage elsewhere, copy the annotation out of
# `helm template ... --set sessionAffinity.enabled=true` — with ingress.enabled
# false the setting has nowhere to land and NOTES.txt says so.
# ---------------------------------------------------------------------------
sessionAffinity:
  enabled: false
  # Annotation dialect. Only "nginx" (ingress-nginx) is translated; any other
  # value fails the render rather than emitting an annotation no controller
  # honours. Traefik and HAProxy express affinity differently and are NOT
  # translated here — set ingress.annotations by hand for those.
  controller: nginx
  # The nginx variable to hash on. "$request_uri" is the documented example.
  hashBy: "$request_uri"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ---------------------------------------------------------------------------
# Horizontal autoscaling — OFF by default (the minimal path is one pod, and a
# laptop cluster has nothing to scale onto). When enabled the chart renders an
# autoscaling/v2 HPA and the Deployment STOPS emitting `replicas`, so the HPA
# owns the replica count instead of fighting Helm on every upgrade.
#
# Requires: (a) resources.requests set — HPA utilisation is a percentage OF THE
# REQUEST, so the chart hard-fails without one; (b) metrics-server running in
# the cluster (kind/k3d do NOT ship it by default; k3s does).
#
# HORIZONTAL SCALING: WHAT EACH POSTURE COSTS
#
# aisotropyd is NOT stateless. Working memory (chat turns + summary buffer),
# the quota token-buckets and the cost meter all live INSIDE the process, in an
# embedded BadgerDB (internal/memory, wired in aisotropy/app.go). There is no
# shared backend for any of them. Two postures, two different failures:
#
#   persistence.enabled: false  (the default)
#     N replicas START fine — but each pod holds its own working memory. A
#     request that lands on a replica which never served that user finds NO
#     conversation history and answers from a cold context. That is a WRONG
#     ANSWER, not an error: nothing is logged as a failure and the client gets
#     no signal. This is the posture this chart used to call "safe".
#     -> Mitigated (not fixed) by sessionAffinity above: same user, same
#        replica, as long as the client stays on one route.
#
#   persistence.enabled: true
#     The SECOND replica never starts. Every pod mounts the same ReadWriteOnce
#     PVC and BadgerDB takes an exclusive directory lock (badger.Open in
#     internal/memory/working_memory.go), so pod #2 fails to attach the volume
#     (multi-attach) or crash-loops on the lock. The chart REFUSES to render
#     this combination — a template that will not render beats a CrashLoop.
#     -> sessionAffinity does not help here at all.
#
# In EVERY posture, per-tenant quota and /costs stay per-process: with N
# replicas each tenant effectively gets N times its configured rate, and
# /costs reports only what that one replica served. Affinity does not fix that
# either. See docs/deployment/runbook.md §1.
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # Set to a number to add a memory metric alongside CPU.
  targetMemoryUtilizationPercentage: null
  # Optional autoscaling/v2 scaleUp/scaleDown stabilisation policy.
  behavior: {}

# Pod-level hardening. The Distroless nonroot image already runs as 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Liveness -> /healthz (cheap, always 200 while up).
# Readiness -> /health (probes facts + semantic tiers; 503 when degraded).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
