# Default values for aisotropy — MINIMAL BY DEFAULT.
#
# Out of the box this renders ONE Distroless binary with in-process memory tiers
# (BadgerDB working memory + in-process SQLite/FTS5 facts + in-process cosine
# semantic). No rqlite, no Qdrant, no persistence, no ingress. Flip the toggles
# below to grow into the networked-tier deployment.

replicaCount: 1

image:
  # Built locally from the repo Dockerfile and side-loaded (kind load / k3d image
  # import). Override to a registry ref for a real deployment.
  repository: aisotropy
  tag: local
  # IfNotPresent so a locally-loaded tag is not re-pulled from a registry.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Container listen address -> AISOTROPY_ADDR. The Service and probes follow this
# port automatically.
containerPort: 8080

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""

# ---------------------------------------------------------------------------
# Authentication (ADR-0024). Empty jwtSecret -> the binary boots in NoAuth mode
# (path tenant_id/user_id trusted, no credential check). Fine for a local
# throwaway cluster; set a >= 32-byte HS256 secret for anything reachable.
# The binary REFUSES TO BOOT on a shorter secret.
# ---------------------------------------------------------------------------
auth:
  # Provide the secret value here (chart creates the Secret)...
  jwtSecret: ""
  # ...or point at a pre-existing Secret you manage out-of-band.
  existingSecret: ""
  jwtSecretKey: AISOTROPY_JWT_SECRET

# Optional LLM provider key. Empty -> keyless stub (canned responses); the
# runtime still boots and every memory tier is exercisable.
anthropicApiKey: ""

# Optional bearer token gating the /costs and /bitrate ops endpoints. Empty ->
# those endpoints stay 503 (default-closed).
opsToken: ""

# ---------------------------------------------------------------------------
# Transport + NoAuth posture (coordinate with auth above).
#   requireTLS -> AISOTROPY_REQUIRE_TLS: aisotropyd refuses plaintext when true.
#     Keep false locally; set true in production (front with a TLS-terminating
#     ingress/proxy — see deploy/proxy, docs/deployment/reverse-proxy.md).
#   allowNoAuth -> AISOTROPY_ALLOW_NOAUTH: explicit opt-in to the keyless NoAuth
#     path (trusts path tenant_id/user_id with no credential check). true keeps
#     the local zero-config path booting; MUST be false in production so a JWT
#     secret is required. See values-prod.yaml for the hardened combination.
# ---------------------------------------------------------------------------
requireTLS: false
allowNoAuth: true

# ---------------------------------------------------------------------------
# NetworkPolicy fronting the networked tiers: default-deny ingress to rqlite +
# Qdrant, allow ONLY the aisotropyd pod. Only rendered when tiers.networked is
# enabled (no tier pods otherwise). Requires a policy-capable CNI to ENFORCE
# (Calico/Cilium/Antrea); kindnet/flannel render it but do not enforce.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true

# Extra plain (non-secret) env vars, injected verbatim.
extraEnv: []
#  - name: AISOTROPY_RATE_PER_SEC
#    value: "50"

# ---------------------------------------------------------------------------
# Networked memory tiers — OFF by default (this is the whole "minimal" point).
# When enabled, the chart deploys rqlite (facts) + Qdrant (semantic) as
# StatefulSets and wires aisotropyd via RQLITE_URL / QDRANT_HOST, mirroring
# docker-compose.yml.
# ---------------------------------------------------------------------------
tiers:
  networked:
    enabled: false
    # -----------------------------------------------------------------------
    # Tier credentials (rqlite HTTP auth + Qdrant API key). Provisioned as a
    # Secret, NOT a ConfigMap. The defaults below are LOCAL-ONLY placeholders —
    # override them (or point at an existingSecret) for anything reachable. The
    # same QDRANT_API_KEY value is presented by both the Qdrant service and the
    # aisotropyd client; the rqlite user:password is embedded in RQLITE_URL and
    # matched in the -auth users file.
    # -----------------------------------------------------------------------
    auth:
      qdrantApiKey: "local-dev-qdrant-key-CHANGE-ME"
      rqliteUser: "aisotropy"
      rqlitePassword: "local-dev-rqlite-pw-CHANGE-ME"
      # Provide your own Secret instead (keys: QDRANT_API_KEY, RQLITE_URL,
      # rqlite-users.json). When set, the chart does not render its own.
      existingSecret: ""
    # Pod- and container-level hardening applied to BOTH tier StatefulSets.
    # rqlite/qdrant run fine non-root (they only write to their mounted data
    # dirs); fsGroup makes the PVC group-writable for the non-root UID.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    rqlite:
      image: rqlite/rqlite:8.36.3
      httpPort: 4001
      raftPort: 4002
      storage: 1Gi
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
    qdrant:
      image: qdrant/qdrant:v1.12.4
      restPort: 6333
      grpcPort: 6334
      collection: aisotropy_knowledge
      # Present QDRANT_USE_TLS=true to the aisotropyd client. Only set true when
      # Qdrant actually serves TLS; in-cluster plaintext gRPC is fine behind the
      # NetworkPolicy for most deployments.
      useTLS: false
      storage: 2Gi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi

# ---------------------------------------------------------------------------
# On-disk mode for aisotropyd's OWN working memory (AISOTROPY_DATA_DIR). OFF by
# default -> fully in-memory, stateless pod.
# ---------------------------------------------------------------------------
persistence:
  enabled: false
  mountPath: /data
  size: 1Gi
  accessMode: ReadWriteOnce
  # storageClassName: "" -> cluster default (kind standard, k3s local-path).
  storageClassName: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aisotropy.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ---------------------------------------------------------------------------
# Horizontal autoscaling — OFF by default (the minimal path is one pod, and a
# laptop cluster has nothing to scale onto). When enabled the chart renders an
# autoscaling/v2 HPA and the Deployment STOPS emitting `replicas`, so the HPA
# owns the replica count instead of fighting Helm on every upgrade.
#
# Requires: (a) resources.requests set — HPA utilisation is a percentage OF THE
# REQUEST, so the chart hard-fails without one; (b) metrics-server running in
# the cluster (kind/k3d do NOT ship it by default; k3s does).
#
# aisotropyd is stateless in the minimal (in-process, no-persistence) posture,
# so horizontal scaling is safe there. With persistence.enabled the pods share
# ONE ReadWriteOnce PVC — do not scale past 1 replica in that shape.
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # Set to a number to add a memory metric alongside CPU.
  targetMemoryUtilizationPercentage: null
  # Optional autoscaling/v2 scaleUp/scaleDown stabilisation policy.
  behavior: {}

# Pod-level hardening. The Distroless nonroot image already runs as 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Liveness -> /healthz (cheap, always 200 while up).
# Readiness -> /health (probes facts + semantic tiers; 503 when degraded).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
