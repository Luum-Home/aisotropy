apiVersion: v2
name: aisotropy
description: |
  Aisotropy — a single Distroless Go runtime (the "LLM OS") that boots a complete
  tiered-memory agent with IN-PROCESS defaults. Minimal-by-default: no external
  services required. Networked memory tiers (rqlite facts, Qdrant semantic) are an
  opt-in toggle mirroring the repo's docker-compose.yml.
type: application
# Chart version — bump on chart changes.
version: 0.1.0
# The aisotropyd binary version this chart targets (informational).
appVersion: "0.1.0"
home: https://github.com/Luum-Home/aisotropy
sources:
  - https://github.com/Luum-Home/aisotropy
keywords:
  - llm
  - agent
  - ai
  - distroless
  - minimal
maintainers:
  - name: Luum-Home
