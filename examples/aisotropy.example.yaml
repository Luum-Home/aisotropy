# Aisotropy declarative WIRING config (ADR-0016 lever #5).
#
# This file carries DEPLOYMENT VALUES ONLY — addresses, limits, pricing, literal
# personas, and MCP server references. It deliberately CANNOT declare a tool with
# Go behavior, the LLM client, or a typed handler: those stay Go options
# (WithToolExecutor / WithTypedTool / WithLLM), because a YAML file cannot carry a
# Go func and a behavior-less tool list is the "magic" ADR-0002 forbids.
#
# MCP servers are allowed here: their behavior lives in the external process this
# file only points at — so you can add polyglot tools with no Go at all.
#
# Load and compose with Go options:
#
#   opts, err := aisotropy.OptionsFromConfigFile("aisotropy.yaml")
#   if err != nil { log.Fatal(err) }
#   app := aisotropy.New(append(opts,
#       aisotropy.WithTypedTool("get_weather", "...", "read:weather", getWeather),
#   )...)
#
# Options apply in order — a Go option after the config overrides the file
# (config = defaults, code = overrides).

# HTTP listen address (default: AISOTROPY_ADDR env, or :8080).
addr: ":8080"

# Per-tenant token-bucket rate limit.
rate_limit:
  per_sec: 10
  burst: 30

# USD pricing per 1M tokens, for the GET /costs estimate.
cost_pricing:
  input_per_1m: 3.0
  output_per_1m: 15.0

# Per-product base prompts (literal strings, no templating). product_id "" is the
# default persona for any product_id without a specific entry.
personas:
  - product_id: ""
    base_prompt: "You are the Aisotropy agent. Respond briefly and directly."
  - product_id: weatherbot
    base_prompt: "You are WeatherBot. Answer weather questions concisely and cite the city."

# MCP servers whose tools become scope-gated Aisotropy tools. The behavior is the
# external process; this only names it (command + args) and its required scope.
mcp_servers:
  - required_scope: "read:files"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
